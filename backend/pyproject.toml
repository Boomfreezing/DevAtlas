[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devatlas-backend"
version = "0.9.0"
description = "Local-first source repository analysis API"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.8,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "tree-sitter==0.25.2",
  "tree-sitter-python>=0.25,<1.0",
  "tree-sitter-typescript>=0.23,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
